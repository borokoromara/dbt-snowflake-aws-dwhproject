version: 2

models:
  - name: fct_sales
    columns:
      - name: sales_key
        tests:
          - unique
          - not_null

      - name: order_number
        tests:
          - not_null

      - name: product_key
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id

      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
