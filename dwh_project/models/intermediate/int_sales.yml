version: 2

models:
  - name: int_sales
    columns:
      - name: order_number
        tests:
          - not_null

      - name: product_key
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

          

      - name: product_id
        tests:
          - relationships:
              to: ref('int_product')
              field: product_id
